# finetune config: small custom corpus, en-hi
model:
  name: facebook/mbart-large-50-many-to-many-mmt
  max_source_length: 96
  max_target_length: 96

data:
  src_lang: en
  tgt_lang: hi
  jsonl_path: data/processed/en_hi.train.jsonl
  val_jsonl_path: data/processed/en_hi.val.jsonl
  cache_dir: ./data/cache

train:
  output_dir: ./outputs/finetune-en-hi
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 3.0e-5
  num_train_epochs: 5
  warmup_ratio: 0.06
  weight_decay: 0.01
  fp16: false
  bf16: true
  logging_steps: 25
  save_steps: 250
  eval_steps: 250
  save_total_limit: 2
  seed: 7

generate:
  num_beams: 5
  length_penalty: 1.0
  max_new_tokens: 96
  no_repeat_ngram_size: 3

mlflow:
  tracking_uri: file:./mlruns
  experiment_name: mnt-mbart50-finetune
  run_name: en-hi-v0
