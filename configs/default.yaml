# default config for multilingual-nmt-production
model:
  name: facebook/mbart-large-50-many-to-many-mmt
  max_source_length: 128
  max_target_length: 128

data:
  src_lang: en_XX
  tgt_lang: hi_IN
  dataset: tatoeba
  cache_dir: ./data/cache

train:
  output_dir: ./outputs/run0
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 16
  learning_rate: 3.0e-5
  num_train_epochs: 3
  warmup_ratio: 0.06
  weight_decay: 0.01
  logging_steps: 50
  save_steps: 500
  eval_steps: 500
  seed: 7

generate:
  num_beams: 5
  length_penalty: 1.0
  max_new_tokens: 128
  no_repeat_ngram_size: 3

mlflow:
  tracking_uri: file:./mlruns
  experiment_name: mnt-mbart50
